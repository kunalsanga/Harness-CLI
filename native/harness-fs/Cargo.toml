[package]
name = "harness-fs"
version = "0.1.0"
edition = "2021"
description = "Fast filesystem operations for Harness Engineering CLI"
license = "MIT"

[lib]
name = "harness_fs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
walkdir = "2"
ignore = "0.4"
globset = "0.4"
rayon = "1.10"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-pcre2 = { version = "0.1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
